name: Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags starting with v

jobs:
  version-check:
    name: Verify Version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      version_match: ${{ steps.check.outputs.match }}
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - id: check
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PROJECT_VERSION=$(uv version | awk '{print $2}')
          echo "Tag version: $TAG_VERSION"
          echo "Project version: $PROJECT_VERSION"
          if [ "$TAG_VERSION" = "$PROJECT_VERSION" ]; then
            echo "match=true" >> $GITHUB_OUTPUT
            echo "Versions match!"
          else
            echo "match=false" >> $GITHUB_OUTPUT
            echo "Version mismatch! Tag is $TAG_VERSION but pyproject.toml is $PROJECT_VERSION"
            exit 1
          fi

  ci:
    name: Run CI
    needs: [version-check]
    uses: ./.github/workflows/ci.yml

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version-check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: doc/changelog.md
          files: dist/*
          generate_release_notes: false

  publish:
    name: Upload to PyPI
    if: startsWith(github.ref, 'refs/tags/') && needs.version-check.result == 'success'
    needs: [version-check, ci, create-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
