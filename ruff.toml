exclude = [
    "venv",
    ".venv",
    ".vscode",
    ".egg",
    ".git",
    "build",
    "_build",
    "dist",
    "site-packages",
    "data",
]

line-length = 120
indent-width = 4
target-version = "py313"

[lint]
select = ["ALL"]
ignore = [
    "C901",
    "FBT003",
    "PLR0912",
    "FBT001",
    "S603",
    "BLE001",
    "E501",
    "D203",
    "D105",
    "D107",
    "D211",
    "D212",
    "ANN204",
    "S608",
    "DTZ005",
    "B905",
    "SIM103",
    "FIX002",
    "TD003",
    "PLR2004",
    "ANN001",
    "B005",
    "ERA001",
    "COM812",
]
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"__init__.py" = ["D100", "D104", "E402", "F401"]
"**/{tests,docs,tools}/*" = ["E402", "ANN", "INP", "S", "D100"]
"telegram_bot.py" = ["ALL"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
preview = true
